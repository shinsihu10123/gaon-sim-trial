name: Stage 3 Format Helper

on:
  push:
    branches: [feature/stage-3-1-human-group-state-model]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-3-1-human-group-state-model
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/simulation-model/src/entity.rs crates/simulation-model/src/lib.rs
          git commit -m "style: apply rustfmt to Stage 3.1 model"
          git push origin HEAD:feature/stage-3-1-human-group-state-model
