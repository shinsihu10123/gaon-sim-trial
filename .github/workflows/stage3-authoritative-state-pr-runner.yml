name: Stage 3 Authoritative State PR Runner

on:
  pull_request:
    branches: [develop]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/stage-3-1-authoritative-human-group-state'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling from develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: tooling
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/stage-3-1-authoritative-human-group-state
          path: work
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply authoritative state patch
        run: |
          python tooling/scripts/stage3_authoritative_state_patch.py work
          cd work
          cargo fmt --all
      - name: Commit patch
        run: |
          cd work
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates viewer/src
          git commit -m "feat: persist authoritative HumanGroup runtime state"
          git push origin HEAD:feature/stage-3-1-authoritative-human-group-state
