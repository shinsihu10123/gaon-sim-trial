name: Stage 2.5 PR Migration

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feature/stage-2-5-dynamic-entity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-5-dynamic-entity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply migration
        run: python3 scripts/stage2-5-migrate.py
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Commit migration result
        run: |
          rm -f .github/workflows/stage2-5-entity-migrate.yml
          rm -f scripts/stage2-5-migrate.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire dynamic entity lifecycle foundation"
          git push
