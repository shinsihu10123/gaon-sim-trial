name: Stage 2 Temporary Rustfmt

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Persist formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates Cargo.toml
          if git diff --cached --quiet; then
            echo "Formatting already canonical"
          else
            git commit -m "style: apply rustfmt to Stage 2.2 terrain"
            git push origin HEAD:${{ github.head_ref }}
          fi
