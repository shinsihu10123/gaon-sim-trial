name: Rustfmt Preview

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Upload formatted Rust sources
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-preview-${{ github.sha }}
          path: |
            crates/simulation-core/src/entity_lifecycle.rs
            crates/simulation-core/tests/dynamic_entity.rs
            crates/simulation-model/src/world.rs
            crates/simulation-protocol/src/lib.rs
            crates/simulation-protocol/tests/human_group_snapshot.rs
            crates/simulation-runner/src/main.rs
            crates/simulation-wasm/src/lib.rs
            crates/simulation-worldgen/src/bootstrap.rs
            crates/simulation-worldgen/src/lib.rs
          if-no-files-found: error
          retention-days: 1
