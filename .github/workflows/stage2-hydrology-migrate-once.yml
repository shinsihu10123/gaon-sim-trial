name: Stage 2.2 Hydrology Migration Once

on:
  push:
    branches: [feature/stage-2-2-terrain]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-2-terrain
      - name: Apply schema and viewer migration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected fragment missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("crates/simulation-save/src/lib.rs",
              "/// Stage 2.2 adds the canonical terrain heightfield to authoritative state.\npub const SAVE_FORMAT_VERSION: u32 = 3;",
              "/// Stage 2.2 adds deterministic terrain, hydrology and landmass topology.\npub const SAVE_FORMAT_VERSION: u32 = 4;")

          replace_once("crates/simulation-save/src/binary.rs",
              "SimulationDate, TerrainSample, TerrainState, WorldBounds, WorldSpatialState, WorldState,",
              "SimulationDate, TerrainHydrology, TerrainLandmasses, TerrainSample, TerrainState, WorldBounds,\n    WorldSpatialState, WorldState,")
          replace_once("crates/simulation-save/src/binary.rs",
              "        write_biome(bytes, sample.biome);\n    }\n    Ok(())\n}\n\nfn read_terrain",
              "        write_biome(bytes, sample.biome);\n    }\n    write_derived_geography(bytes, terrain)?;\n    Ok(())\n}\n\nfn read_terrain")
          replace_once("crates/simulation-save/src/binary.rs",
              "    let terrain = TerrainState {\n        bounds,\n        width,\n        height,\n        spacing_m,\n        sea_level_m,\n        samples,\n    };",
              "    let (hydrology, landmasses) = read_derived_geography(cursor)?;\n    let terrain = TerrainState {\n        bounds,\n        width,\n        height,\n        spacing_m,\n        sea_level_m,\n        samples,\n        hydrology,\n        landmasses,\n    };")

          binary = Path("crates/simulation-save/src/binary.rs")
          text = binary.read_text()
          marker = "fn write_relief(bytes: &mut Vec<u8>, relief: ReliefClass) {"
          if "fn write_derived_geography" not in text:
              helper = r'''fn write_derived_geography(bytes: &mut Vec<u8>, terrain: &TerrainState) -> Result<(), SaveError> {
    match (&terrain.hydrology, &terrain.landmasses) {
        (None, None) => write_u8(bytes, 0),
        (Some(hydrology), Some(landmasses)) => {
            write_u8(bytes, 1);
            write_count(bytes, "terrain_downstream", hydrology.downstream_indices.len())?;
            for &value in &hydrology.downstream_indices { write_u32(bytes, value); }
            write_count(bytes, "terrain_basins", hydrology.drainage_basin_ids.len())?;
            for &value in &hydrology.drainage_basin_ids { write_u16(bytes, value); }
            write_count(bytes, "terrain_flow", hydrology.flow_accumulation.len())?;
            for &value in &hydrology.flow_accumulation { write_u32(bytes, value); }
            write_count(bytes, "terrain_rivers", hydrology.river_orders.len())?;
            for &value in &hydrology.river_orders { write_u8(bytes, value); }
            write_count(bytes, "terrain_landmasses", landmasses.landmass_ids.len())?;
            for &value in &landmasses.landmass_ids { write_u16(bytes, value); }
            write_count(bytes, "terrain_islands", landmasses.island_landmass_ids.len())?;
            for &value in &landmasses.island_landmass_ids { write_u16(bytes, value); }
        }
        _ => return Err(SaveError::InvalidBinary("partial terrain derived geography")),
    }
    Ok(())
}

fn read_derived_geography(cursor: &mut Cursor<'_>) -> Result<(Option<TerrainHydrology>, Option<TerrainLandmasses>), SaveError> {
    match cursor.read_u8()? {
        0 => Ok((None, None)),
        1 => {
            let count = cursor.read_count("terrain_downstream")?;
            let mut downstream_indices = Vec::with_capacity(count);
            for _ in 0..count { downstream_indices.push(cursor.read_u32()?); }
            let count = cursor.read_count("terrain_basins")?;
            let mut drainage_basin_ids = Vec::with_capacity(count);
            for _ in 0..count { drainage_basin_ids.push(cursor.read_u16()?); }
            let count = cursor.read_count("terrain_flow")?;
            let mut flow_accumulation = Vec::with_capacity(count);
            for _ in 0..count { flow_accumulation.push(cursor.read_u32()?); }
            let count = cursor.read_count("terrain_rivers")?;
            let mut river_orders = Vec::with_capacity(count);
            for _ in 0..count { river_orders.push(cursor.read_u8()?); }
            let count = cursor.read_count("terrain_landmasses")?;
            let mut landmass_ids = Vec::with_capacity(count);
            for _ in 0..count { landmass_ids.push(cursor.read_u16()?); }
            let count = cursor.read_count("terrain_islands")?;
            let mut island_landmass_ids = Vec::with_capacity(count);
            for _ in 0..count { island_landmass_ids.push(cursor.read_u16()?); }
            Ok((Some(TerrainHydrology { downstream_indices, drainage_basin_ids, flow_accumulation, river_orders }), Some(TerrainLandmasses { landmass_ids, island_landmass_ids })))
        }
        tag => Err(SaveError::InvalidTag { field: "terrain derived geography", tag }),
    }
}

'''
              if marker not in text: raise SystemExit("binary helper marker missing")
              binary.write_text(text.replace(marker, helper + marker, 1))

          replace_once("crates/simulation-protocol/src/lib.rs",
              "pub const RENDER_SNAPSHOT_VERSION: u32 = 2;",
              "pub const RENDER_SNAPSHOT_VERSION: u32 = 3;")
          replace_once("crates/simulation-protocol/src/lib.rs",
              "    pub relief_codes: Vec<u8>,\n    pub biome_codes: Vec<u8>,",
              "    pub relief_codes: Vec<u8>,\n    pub biome_codes: Vec<u8>,\n    pub downstream_indices: Vec<u32>,\n    pub drainage_basin_ids: Vec<u16>,\n    pub flow_accumulation: Vec<u32>,\n    pub river_orders: Vec<u8>,\n    pub landmass_ids: Vec<u16>,\n    pub island_landmass_ids: Vec<u16>,")
          replace_once("crates/simulation-protocol/src/lib.rs",
              "            biome_codes: terrain\n                .samples\n                .iter()\n                .map(|sample| biome_code(sample.biome))\n                .collect(),",
              "            biome_codes: terrain\n                .samples\n                .iter()\n                .map(|sample| biome_code(sample.biome))\n                .collect(),\n            downstream_indices: terrain.hydrology.as_ref().map_or_else(Vec::new, |value| value.downstream_indices.clone()),\n            drainage_basin_ids: terrain.hydrology.as_ref().map_or_else(Vec::new, |value| value.drainage_basin_ids.clone()),\n            flow_accumulation: terrain.hydrology.as_ref().map_or_else(Vec::new, |value| value.flow_accumulation.clone()),\n            river_orders: terrain.hydrology.as_ref().map_or_else(Vec::new, |value| value.river_orders.clone()),\n            landmass_ids: terrain.landmasses.as_ref().map_or_else(Vec::new, |value| value.landmass_ids.clone()),\n            island_landmass_ids: terrain.landmasses.as_ref().map_or_else(Vec::new, |value| value.island_landmass_ids.clone()),")

          replace_once("viewer/src/types.ts",
              "  reliefCodes: number[];\n  biomeCodes: number[];",
              "  reliefCodes: number[];\n  biomeCodes: number[];\n  downstreamIndices: number[];\n  drainageBasinIds: number[];\n  flowAccumulation: number[];\n  riverOrders: number[];\n  landmassIds: number[];\n  islandLandmassIds: number[];")

          replace_once("crates/simulation-worldgen/src/hydrology.rs",
              ".map(|&elevation| u32::from(elevation >= 0))",
              ".map(|&elevation| if elevation >= 0 { 1_u32 } else { 0_u32 })")
          replace_once("crates/simulation-worldgen/src/hydrology.rs",
              "        let side = 17;\n        let mut elevations = vec![-500_i16; side * side];\n        for z in 6..=10 {\n            for x in 6..=10 {",
              "        let side = 25;\n        let mut elevations = vec![-500_i16; side * side];\n        for z in 10..=14 {\n            for x in 10..=14 {")

          replace_once("viewer/src/terrain-layer.ts",
              "  private seaMesh: THREE.Mesh | undefined;",
              "  private seaMesh: THREE.Mesh | undefined;\n  private riverLines: THREE.LineSegments | undefined;")
          replace_once("viewer/src/terrain-layer.ts",
              "      terrain.biomeCodes.length !== sampleCount ||\n      terrain.reliefCodes.length !== sampleCount",
              "      terrain.biomeCodes.length !== sampleCount ||\n      terrain.reliefCodes.length !== sampleCount ||\n      terrain.downstreamIndices.length !== sampleCount ||\n      terrain.riverOrders.length !== sampleCount ||\n      terrain.landmassIds.length !== sampleCount")
          replace_once("viewer/src/terrain-layer.ts",
              "    this.seaMesh.name = \"authoritative-sea-level\";\n    this.scene.add(this.seaMesh);",
              "    this.seaMesh.name = \"authoritative-sea-level\";\n    this.scene.add(this.seaMesh);\n\n    this.riverLines = buildRiverLines(terrain, positions);\n    if (this.riverLines !== undefined) {\n      this.scene.add(this.riverLines);\n    }")
          replace_once("viewer/src/terrain-layer.ts",
              "    if (this.seaMesh !== undefined) {\n      this.seaMesh.removeFromParent();\n      this.seaMesh.geometry.dispose();\n      disposeMaterial(this.seaMesh.material);\n      this.seaMesh = undefined;\n    }",
              "    if (this.seaMesh !== undefined) {\n      this.seaMesh.removeFromParent();\n      this.seaMesh.geometry.dispose();\n      disposeMaterial(this.seaMesh.material);\n      this.seaMesh = undefined;\n    }\n    if (this.riverLines !== undefined) {\n      this.riverLines.removeFromParent();\n      this.riverLines.geometry.dispose();\n      disposeMaterial(this.riverLines.material);\n      this.riverLines = undefined;\n    }")
          terrain_layer = Path("viewer/src/terrain-layer.ts")
          text = terrain_layer.read_text()
          if "function buildRiverLines" not in text:
              marker = "function disposeMaterial(material: THREE.Material | THREE.Material[]): void {"
              helper = '''function buildRiverLines(terrain: RenderTerrainSnapshot, positions: Float32Array): THREE.LineSegments | undefined {\n  const noDownstream = 0xffffffff;\n  const segments: number[] = [];\n  for (let index = 0; index < terrain.riverOrders.length; index += 1) {\n    if (terrain.riverOrders[index] === 0) continue;\n    const downstream = terrain.downstreamIndices[index];\n    if (downstream === noDownstream || downstream < 0 || downstream >= terrain.riverOrders.length) continue;\n    const sourceOffset = index * 3;\n    const targetOffset = downstream * 3;\n    segments.push(positions[sourceOffset], positions[sourceOffset + 1] + 0.025, positions[sourceOffset + 2]);\n    segments.push(positions[targetOffset], positions[targetOffset + 1] + 0.025, positions[targetOffset + 2]);\n  }\n  if (segments.length === 0) return undefined;\n  const geometry = new THREE.BufferGeometry();\n  geometry.setAttribute("position", new THREE.Float32BufferAttribute(segments, 3));\n  const material = new THREE.LineBasicMaterial({ color: 0x5f8fa8, transparent: true, opacity: 0.9 });\n  const lines = new THREE.LineSegments(geometry, material);\n  lines.name = "authoritative-river-network";\n  return lines;\n}\n\n'''
              if marker not in text: raise SystemExit("terrain layer helper marker missing")
              terrain_layer.write_text(text.replace(marker, helper + marker, 1))

          contract = Path("scripts/check-terrain-contract.mjs")
          text = contract.read_text()
          text = text.replace('Number(versionMatch[1]) < 3', 'Number(versionMatch[1]) < 4')
          text = text.replace('Stage 2.2 requires save format version 3 or newer', 'Stage 2.2 hydrology requires save format version 4 or newer')
          if '"TerrainHydrology"' not in text:
              text = text.replace('"pub struct TerrainState",', '"pub struct TerrainState",\n  "TerrainHydrology",\n  "TerrainLandmasses",')
          if '"derive_hydrology"' not in text:
              text = text.replace('"classify_biome",', '"classify_biome",\n  "derive_hydrology",\n  "derive_landmasses",\n  "ensure_seeded_island",')
          if '"downstream_indices: Vec<u32>"' not in text:
              text = text.replace('"biome_codes: Vec<u8>",', '"biome_codes: Vec<u8>",\n  "downstream_indices: Vec<u32>",\n  "drainage_basin_ids: Vec<u16>",\n  "river_orders: Vec<u8>",\n  "landmass_ids: Vec<u16>",')
          if '"authoritative-river-network"' not in text:
              text = text.replace('"computeVertexNormals",', '"computeVertexNormals",\n  "authoritative-river-network",')
          contract.write_text(text)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit migration and remove one-shot workflow
        run: |
          rm .github/workflows/stage2-hydrology-migrate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates viewer scripts .github/workflows/stage2-hydrology-migrate-once.yml
          git commit -m "feat(stage2): persist rivers basins and islands"
          git push origin HEAD:feature/stage-2-2-terrain
