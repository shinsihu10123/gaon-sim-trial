name: Stage 2.4 Clippy fix

on:
  push:
    branches: [feature/stage-2-4-resources]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-4-resources
          fetch-depth: 0
      - name: Merge duplicate match arms
        shell: python
        run: |
          from pathlib import Path
          p = Path("crates/simulation-model/src/resources.rs")
          text = p.read_text()
          old = '''            Self::InvalidEmptyDeposit => ResourceErrorKind::InvalidEmptyDeposit,
            Self::WrongCellCount { .. }
            | Self::InvalidCell { .. }
            | Self::OceanContainsLandResources { .. } => ResourceErrorKind::InvalidEmptyDeposit,
'''
          new = '''            Self::InvalidEmptyDeposit
            | Self::WrongCellCount { .. }
            | Self::InvalidCell { .. }
            | Self::OceanContainsLandResources { .. } => ResourceErrorKind::InvalidEmptyDeposit,
'''
          if old not in text:
              raise SystemExit("expected duplicate match arms not found")
          p.write_text(text.replace(old, new, 1))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: rm .github/workflows/stage-2-4-clippy-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage2.4): satisfy strict Clippy resource model" || exit 0
          git push origin HEAD:feature/stage-2-4-resources
