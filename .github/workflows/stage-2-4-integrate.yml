name: Stage 2.4 integrate

on:
  push:
    branches: [feature/stage-2-4-resources]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-4-resources
          fetch-depth: 0
      - name: Apply integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing pattern in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("crates/simulation-worldgen/src/lib.rs", "mod hydrology;\n", "mod hydrology;\nmod resources;\n")
          replace_once(
              "crates/simulation-worldgen/src/lib.rs",
              "use hydrology::ensure_seeded_island;\n",
              "use hydrology::ensure_seeded_island;\npub use resources::{\n    generate_trial_resources, resource_balance_report, validate_resource_balance,\n    ResourceBalanceReport, ResourceGenerationError,\n};\n",
          )

          replace_once(
              "crates/simulation-save/src/lib.rs",
              "/// Stage 2.2 adds the canonical terrain heightfield to authoritative state.\npub const SAVE_FORMAT_VERSION: u32 = 3;",
              "/// Stage 2.4 adds finite resource stocks to authoritative state.\npub const SAVE_FORMAT_VERSION: u32 = 4;",
          )
          replace_once(
              "crates/simulation-save/src/lib.rs",
              "    if world.spatial.validate().is_err() {",
              "    if let Some(resources) = &world.resources {\n        let terrain = world.terrain.as_ref().ok_or(SaveError::SnapshotInvariant(\n            \"resource state exists without canonical terrain\",\n        ))?;\n        if resources.validate_against_terrain(terrain).is_err() {\n            return Err(SaveError::SnapshotInvariant(\n                \"resource state violates Stage 2.4 invariants\",\n            ));\n        }\n    }\n\n    if world.spatial.validate().is_err() {",
          )

          replace_once(
              "crates/simulation-save/src/binary.rs",
              "    QueuedCommand, RegionId, RegionPoliticalState, RegionState, RegionSurface, ReliefClass,\n    SimulationDate, TerrainSample, TerrainState, WorldBounds, WorldSpatialState, WorldState,",
              "    QueuedCommand, RegionId, RegionPoliticalState, RegionState, RegionSurface, ReliefClass,\n    ResourceCellState, ResourceDeposit, ResourceFieldState, SimulationDate, TerrainSample,\n    TerrainState, WorldBounds, WorldSpatialState, WorldState,",
          )
          replace_once(
              "crates/simulation-save/src/binary.rs",
              "    match world.spatial.bounds {",
              "    match &world.resources {\n        None => write_u8(bytes, 0),\n        Some(resources) => {\n            write_u8(bytes, 1);\n            write_resource_field(bytes, resources)?;\n        }\n    }\n\n    match world.spatial.bounds {",
          )
          replace_once(
              "crates/simulation-save/src/binary.rs",
              "    let spatial = match cursor.read_u8()? {",
              "    let resources = match cursor.read_u8()? {\n        0 => None,\n        1 => Some(read_resource_field(cursor)?),\n        tag => {\n            return Err(SaveError::InvalidTag {\n                field: \"resource state\",\n                tag,\n            });\n        }\n    };\n\n    let spatial = match cursor.read_u8()? {",
          )
          replace_once(
              "crates/simulation-save/src/binary.rs",
              "        terrain,\n        spatial,",
              "        terrain,\n        resources,\n        spatial,",
          )
          marker = "fn write_relief(bytes: &mut Vec<u8>, relief: ReliefClass) {"
          insertion = '''fn write_resource_field(\n    bytes: &mut Vec<u8>,\n    resources: &ResourceFieldState,\n) -> Result<(), SaveError> {\n    write_count(bytes, \"resource_cells\", resources.cells.len())?;\n    for cell in &resources.cells {\n        write_u32(bytes, cell.food_capacity_tonnes_per_year);\n        write_resource_deposit(bytes, cell.energy);\n        write_resource_deposit(bytes, cell.metals);\n        write_resource_deposit(bytes, cell.construction);\n    }\n    Ok(())\n}\n\nfn read_resource_field(cursor: &mut Cursor<'_>) -> Result<ResourceFieldState, SaveError> {\n    let count = cursor.read_count(\"resource_cells\")?;\n    let mut cells = Vec::with_capacity(count);\n    for _ in 0..count {\n        cells.push(ResourceCellState {\n            food_capacity_tonnes_per_year: cursor.read_u32()?,\n            energy: read_resource_deposit(cursor)?,\n            metals: read_resource_deposit(cursor)?,\n            construction: read_resource_deposit(cursor)?,\n        });\n    }\n    ResourceFieldState::new(cells)\n        .map_err(|_| SaveError::InvalidBinary(\"invalid Stage 2.4 resource field\"))\n}\n\nfn write_resource_deposit(bytes: &mut Vec<u8>, deposit: ResourceDeposit) {\n    write_u64(bytes, deposit.initial_quantity);\n    write_u64(bytes, deposit.remaining_quantity);\n    write_u16(bytes, deposit.quality_permille);\n    write_u16(bytes, deposit.accessibility_permille);\n}\n\nfn read_resource_deposit(cursor: &mut Cursor<'_>) -> Result<ResourceDeposit, SaveError> {\n    let deposit = ResourceDeposit {\n        initial_quantity: cursor.read_u64()?,\n        remaining_quantity: cursor.read_u64()?,\n        quality_permille: cursor.read_u16()?,\n        accessibility_permille: cursor.read_u16()?,\n    };\n    deposit\n        .validate()\n        .map_err(|_| SaveError::InvalidBinary(\"invalid resource deposit\"))?;\n    Ok(deposit)\n}\n\n'''
          replace_once("crates/simulation-save/src/binary.rs", marker, insertion + marker)

          replace_once(
              "crates/simulation-wasm/src/lib.rs",
              "use simulation_worldgen::generate_trial_terrain;",
              "use simulation_worldgen::{generate_trial_resources, generate_trial_terrain};",
          )
          replace_once(
              "crates/simulation-wasm/src/lib.rs",
              "        let engine = SimulationEngine::new(seed);\n        let mut snapshot = engine.export_snapshot();\n        snapshot.world.terrain = Some(terrain);",
              "        let resources = generate_trial_resources(seed, &terrain)\n            .map_err(|error| JsValue::from_str(&error.to_string()))?;\n\n        let engine = SimulationEngine::new(seed);\n        let mut snapshot = engine.export_snapshot();\n        snapshot.world.resources = Some(resources);\n        snapshot.world.terrain = Some(terrain);",
          )
          replace_once(
              "crates/simulation-wasm/src/lib.rs",
              "    use simulation_worldgen::generate_trial_terrain;",
              "    use simulation_worldgen::{generate_trial_resources, generate_trial_terrain};",
          )
          replace_once(
              "crates/simulation-wasm/src/lib.rs",
              "        snapshot.world.terrain = Some(generate_trial_terrain(seed).expect(\"terrain generates\"));",
              "        let terrain = generate_trial_terrain(seed).expect(\"terrain generates\");\n        snapshot.world.resources =\n            Some(generate_trial_resources(seed, &terrain).expect(\"resources generate\"));\n        snapshot.world.terrain = Some(terrain);",
          )
          replace_once(
              "crates/simulation-wasm/src/lib.rs",
              "        assert!(restored.state().terrain.is_some());\n        assert_eq!(restored.state().seed, seed);",
              "        assert!(restored.state().terrain.is_some());\n        assert!(restored.state().resources.is_some());\n        assert_eq!(restored.state().seed, seed);",
          )

          replace_once(
              "crates/simulation-runner/src/main.rs",
              "use simulation_worldgen::generate_trial_terrain;",
              "use simulation_worldgen::{generate_trial_resources, generate_trial_terrain};",
          )
          replace_once(
              "crates/simulation-runner/src/main.rs",
              "    initial.world.terrain =\n        Some(generate_trial_terrain(seed).expect(\"trial terrain must generate\"));",
              "    let terrain = generate_trial_terrain(seed).expect(\"trial terrain must generate\");\n    initial.world.resources =\n        Some(generate_trial_resources(seed, &terrain).expect(\"trial resources must generate\"));\n    initial.world.terrain = Some(terrain);",
          )

      - name: Format
        run: cargo fmt --all
      - name: Self-remove and commit
        run: |
          rm .github/workflows/stage-2-4-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(stage2.4): integrate authoritative resource state"
          git push origin HEAD:feature/stage-2-4-resources
