name: Stage 2 Temporary Clippy Fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Apply machine-applicable Clippy fixes
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets || true
      - name: Persist fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          if git diff --cached --quiet; then
            echo "No machine-applicable Clippy fixes"
          else
            git commit -m "style: apply Clippy fixes to Stage 2.2 terrain"
            git push origin HEAD:${{ github.head_ref }}
          fi
