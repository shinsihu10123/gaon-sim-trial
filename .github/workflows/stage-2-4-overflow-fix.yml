name: Stage 2.4 overflow fix

on:
  push:
    branches: [feature/stage-2-4-resources]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-4-resources
          fetch-depth: 0
      - name: Fix quality intermediate width
        shell: python
        run: |
          from pathlib import Path
          p = Path("crates/simulation-worldgen/src/resources.rs")
          text = p.read_text()
          old = "    let quality = 450_u16.saturating_add(random_permille(seed, index, quality_salt) * 500 / 1_000);\n"
          new = "    let quality_adjustment = u32::from(random_permille(seed, index, quality_salt)) * 500 / 1_000;\n    let quality = 450_u16.saturating_add(u16::try_from(quality_adjustment).unwrap_or(500));\n"
          if old not in text:
              raise SystemExit("quality calculation pattern not found")
          p.write_text(text.replace(old, new, 1))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: rm .github/workflows/stage-2-4-overflow-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage2.4): widen resource quality arithmetic" || exit 0
          git push origin HEAD:feature/stage-2-4-resources
