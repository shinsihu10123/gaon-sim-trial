name: Stage 2.5 Final Clippy Fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/stage-2-5-dynamic-entity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-5-dynamic-entity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply final model Clippy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/simulation-model/src/world.rs')
          t = p.read_text()
          old = '''    #[must_use]\n    pub fn iter(&self) -> std::collections::btree_map::Values<'_, RegionId, RegionState> {\n        self.entries.values()\n    }\n'''
          new = '''    pub fn iter(&self) -> std::collections::btree_map::Values<'_, RegionId, RegionState> {\n        self.entries.values()\n    }\n'''
          if old not in t:
              raise SystemExit('iter anchor not found')
          t = t.replace(old, new, 1)
          old = '        for region in self.regions.iter() {\n'
          new = '        for region in &self.regions {\n'
          if old not in t:
              raise SystemExit('validator loop anchor not found')
          p.write_text(t.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/simulation-model/src/world.rs
          git commit -m "style: finish strict Clippy cleanup for RegionRegistry"
          git push
