name: Stage 1.1 Certification

on:
  push:
    branches: [feature/stage-1-1-viewer-env]

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-1-1-viewer-env
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust strict Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Generate browser WASM bindings
        run: wasm-pack build crates/simulation-wasm --target web --out-dir ../../viewer/src/generated/wasm --out-name simulation_wasm --release
      - name: Install Viewer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix viewer
      - name: Typecheck Viewer
        run: npm run typecheck --prefix viewer
      - name: Build Viewer
        run: npm run build --prefix viewer
      - name: Verify Stage 1.1 ownership contract
        run: node scripts/check-viewer-contract.mjs
      - name: Record certification marker
        run: |
          printf '%s\n' 'Stage 1.1 certification PASS' > docs/.stage1-1-cert-pass
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.stage1-1-cert-pass
          git commit -m "ci: certify Stage 1.1 viewer foundation"
          git push origin HEAD:feature/stage-1-1-viewer-env
