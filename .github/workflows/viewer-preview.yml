name: Viewer Preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: viewer-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Build Rust WASM adapter
        run: wasm-pack build crates/simulation-wasm --target web --out-dir ../../viewer/src/generated/wasm --out-name simulation_wasm --release
      - name: Install Viewer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix viewer
      - name: Typecheck Viewer
        run: npm run typecheck --prefix viewer
      - name: Build Viewer
        run: npm run build --prefix viewer
      - name: Verify Viewer contracts
        run: node scripts/check-viewer-contract.mjs
      - name: Upload downloadable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-preview-dist
          path: viewer/dist
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: viewer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Viewer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
