name: Dynamic Region Clippy Fix

on:
  push:
    branches: [feature/stage-2-1-dynamic-region-audit]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-1-dynamic-region-audit
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add missing error documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/simulation-model/src/world.rs')
          text = path.read_text()
          old = '''    /// This does not enforce [`TRIAL_REGION_COUNT`]; the benchmark caller chooses
    /// the count explicitly.
    pub fn new_trial(
'''
          new = '''    /// This does not enforce [`TRIAL_REGION_COUNT`]; the benchmark caller chooses
    /// the count explicitly.
    ///
    /// # Errors
    ///
    /// Returns the same spatial validation errors as [`Self::new`].
    pub fn new_trial(
'''
          if old not in text:
              raise SystemExit('expected new_trial documentation anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/simulation-model/src/world.rs
          git commit -m "docs(world): document benchmark constructor errors"
          git push
