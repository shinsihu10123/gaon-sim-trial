name: Stage 2.5 Fixer

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/stage-2-5-dynamic-entity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-5-dynamic-entity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply requested fix
        run: |
          if [ ! -f scripts/stage2-5-fix.py ]; then
            echo "No Stage 2.5 fix script present."
            exit 0
          fi
          python3 scripts/stage2-5-fix.py
          cargo fmt --all
          rm scripts/stage2-5-fix.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply Stage 2.5 integration remediation"
          git push
