          )

          cargo fmt --all
          PY
      - name: Commit migration
        run: |
          rm .github/workflows/stage2-5-entity-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire dynamic entity lifecycle foundation"
          git push
