          # Core owns lifecycle execution and emits lifecycle facts before the command-executed fact.
          replace_once(
              'crates/simulation-core/src/lib.rs',
              'mod event_ledger;\n',
              'mod entity_lifecycle;\nmod event_ledger;\n'
          )
          replace_once(
              'crates/simulation-core/src/lib.rs',
              '''    /// Submits a user-originated command using the user intervention priority.
