          )

          # Render protocol uses decimal strings for u64 entity IDs across the JS boundary.
          replace_once(
              'crates/simulation-protocol/src/lib.rs',
              'pub const RENDER_SNAPSHOT_VERSION: u32 = 3;',
              'pub const RENDER_SNAPSHOT_VERSION: u32 = 4;'
          )
          replace_once(
              'crates/simulation-protocol/src/lib.rs',
              '''pub struct RenderRegionSnapshot {
    pub id: u16,
