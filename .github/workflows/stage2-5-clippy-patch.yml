name: Stage 2.5 Clippy Patch

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/stage-2-5-dynamic-entity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-5-dynamic-entity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply strict Clippy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/simulation-model/src/world.rs')
          t = p.read_text()
          t = t.replace('/// The BTreeMap key is the canonical iteration order.', '/// The `BTreeMap` key is the canonical iteration order.', 1)
          old = '''    #[must_use]\n    pub const fn next_id(&self) -> u64 {\n        self.next_id\n    }\n}\n\nimpl Default for RegionRegistry'''
          new = '''    #[must_use]\n    pub fn iter(&self) -> std::collections::btree_map::Values<'_, RegionId, RegionState> {\n        self.entries.values()\n    }\n\n    #[must_use]\n    pub const fn next_id(&self) -> u64 {\n        self.next_id\n    }\n}\n\nimpl Default for RegionRegistry'''
          if old not in t:
              raise SystemExit('RegionRegistry iter anchor not found')
          p.write_text(t.replace(old, new, 1))

          p = Path('crates/simulation-model/src/lib.rs')
          t = p.read_text()
          old = '''            Self::RemoveCountryEntity {\n                country_id: referenced,\n            } => *referenced == country_id,\n            Self::CreateCityEntity {\n                country_id: Some(referenced),\n                ..\n            } => *referenced == country_id,'''
          new = '''            Self::RemoveCountryEntity {\n                country_id: referenced,\n            }\n            | Self::CreateCityEntity {\n                country_id: Some(referenced),\n                ..\n            } => *referenced == country_id,'''
          if old not in t:
              raise SystemExit('country match anchor not found')
          t = t.replace(old, new, 1)
          old = '''            Self::CreateCityEntity {\n                region_id: Some(referenced),\n                ..\n            } => *referenced == region_id,\n            Self::CreateRegionEntity { draft } => draft.neighbors.contains(&region_id),\n            Self::RemoveRegionEntity {\n                region_id: referenced,\n            } => *referenced == region_id,'''
          new = '''            Self::CreateCityEntity {\n                region_id: Some(referenced),\n                ..\n            }\n            | Self::RemoveRegionEntity {\n                region_id: referenced,\n            } => *referenced == region_id,\n            Self::CreateRegionEntity { draft } => draft.neighbors.contains(&region_id),'''
          if old not in t:
              raise SystemExit('region match anchor not found')
          p.write_text(t.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: satisfy strict Clippy for entity registries"
          git push
