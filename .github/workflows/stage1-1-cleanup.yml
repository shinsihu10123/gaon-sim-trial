name: Stage 1.1 One-shot Cleanup

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Remove one-shot Stage 1.1 bootstrap artifacts
        run: |
          git rm --ignore-unmatch \
            .github/workflows/stage1-1-lock-bootstrap.yml \
            .github/workflows/stage1-1-certify.yml \
            .github/workflows/stage1-1-final-certify.yml \
            .github/workflows/stage1-1-cleanup.yml \
            docs/.stage1-1-cert-pass \
            docs/.stage1-1-final-pass
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove Stage 1.1 one-shot CI artifacts"
          git push origin HEAD:develop
