fn read_optional_human_group(cursor: &mut Cursor<'_>) -> Result<Option<HumanGroupId>, SaveError> {
    match cursor.read_u8()? {
        0 => Ok(None),
        1 => Ok(Some(HumanGroupId(cursor.read_u64()?))),
        tag => Err(SaveError::InvalidTag {
            field: "optional HumanGroup id",
            tag,
        }),
    }
}

