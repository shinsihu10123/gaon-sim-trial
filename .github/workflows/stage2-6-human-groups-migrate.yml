name: Stage 2.6 HumanGroup Migration

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'feature/stage-2-6-initial-human-groups' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage-2-6-initial-human-groups
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply Stage 2.6 source migration
        run: |
          python3 scripts/migrate-stage2-6-human-groups.py
          python3 scripts/fix-stage2-6-clippy.py
          cargo fmt --all
      - name: Commit migration and formatting
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/simulation-model/src/entity.rs \
            crates/simulation-model/src/lib.rs \
            crates/simulation-worldgen/src/lib.rs \
            crates/simulation-worldgen/src/human_groups.rs \
            crates/simulation-worldgen/tests/initial_human_groups.rs \
            crates/simulation-save/src/lib.rs \
            crates/simulation-save/src/binary.rs \
            crates/simulation-save/tests/human_group_roundtrip.rs \
            crates/simulation-protocol/src/lib.rs \
            crates/simulation-protocol/tests/human_group_snapshot.rs \
            viewer/src/types.ts
          git commit -m "Normalize Stage 2.6 HumanGroup integration"
          git push origin HEAD:feature/stage-2-6-initial-human-groups
